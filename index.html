<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="rob">
    <form action="#" method="POST">
        <div class="rob1">
            <h1>Personal Details:</h1>
            </div>
            <div class="f1">
        <div>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Enter username">
        </div>
        <br>
        <div>
            <h4>Gender :</h4>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
        </div>
        <br>
        <div>
            <h4>Skills :</h4>
            <input type="checkbox" id="webdevelopment" name="skills[]" value="webdevelopment">
            <label for="webdevelopment">WebDevelopment</label>
            <input type="checkbox" id="acting" name="skills[]" value="acting">
            <label for="acting">Acting</label>
            <input type="checkbox" id="dancing" name="skills[]" value="dancing">
            <label for="dancing">Dancing</label>
            <input type="checkbox" id="singing" name="skills[]" value="singing">
            <label for="singing">Singing</label>
        </div>
        <br>
        <br>
        <div>
            <h4>Comments:</h4>
            <label for="comment"></label>
            <textarea name="comment" id="comment" rows="5" cols="50" placeholder="Comment Here...."></textarea>
        </div>
        <br>
        <div>
            <h4>Favourite Language :</h4>
            <select name="language">
                <option value="none">None</option>
                <option value="C">C</option>
                <option value="C++">C++</option>
                <option value="Java">Java</option>
                <option value="Python">Python</option>
                <option value="Html">Html</option>
                <option value="CSS">CSS</option>
                <option value="Java Script">Java Script</option>
            </select>
        </div>
        <br>
        <br>
        <div class="f2">
            <input type="submit" value="Submit">
        </div>
    </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
